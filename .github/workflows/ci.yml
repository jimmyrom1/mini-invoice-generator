name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoices
          POSTGRES_PASSWORD: invoices
          POSTGRES_DB: invoices_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoices"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://invoices:invoices@localhost:5432/invoices_test
      TEST_DATABASE_URL: postgresql+psycopg://invoices:invoices@localhost:5432/invoices_test
      FLASK_APP: wsgi.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Migraciones (upgrade → downgrade → upgrade)
        run: flask db upgrade && flask db downgrade base && flask db upgrade

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Levantar el stack completo
        run: docker compose up -d --build --wait
      - name: Smoke test a través de nginx
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/invoices | grep -q INV-
          curl -fsS -o /tmp/f.pdf http://localhost:8080/api/invoices/1/pdf && head -c 4 /tmp/f.pdf | grep -q %PDF
          curl -fsS http://localhost:8080/invoices/1 | grep -q '<div id="root">'
      - name: Logs si falla
        if: failure()
        run: docker compose logs
